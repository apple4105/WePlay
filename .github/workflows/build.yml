name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_identity:
        description: 'Inject identity credentials from secrets'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Inject identity
        if: ${{ github.event.inputs.with_identity == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          CERT_B64: ${{ secrets.IDENTITY_CERT_BASE64 }}
          KEY_B64: ${{ secrets.IDENTITY_KEY_BASE64 }}
        run: |
          mkdir -p weplay/Resources
          [ -n "$CERT_B64" ] && echo "$CERT_B64" | base64 --decode > weplay/Resources/leaf.cer
          [ -n "$KEY_B64" ] && echo "$KEY_B64" | base64 --decode > weplay/Resources/private.x963

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project weplay.xcodeproj \
            -scheme WePlay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WePlay.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | xcpretty

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/WePlay.xcarchive/Products/Applications/WePlay.app build/Payload/
          (cd build && zip -qry WePlay-unsigned.ipa Payload)
          shasum -a 256 build/weplay-unsigned.ipa

      - name: Self-test
        run: |
          python3 -I Tools/link_selftest.py
          python3 -I Tools/rtp_selftest.py

      - uses: actions/upload-artifact@v4
        with:
          name: WePlay-unsigned-ipa
          path: build/WePlay-unsigned.ipa
          retention-days: 14
