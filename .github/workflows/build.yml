name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_identity:
        description: 'Inject identity credentials from secrets'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 注入必须在 xcodegen 之前：资源文件要先存在，生成的工程才会包含它们
      - name: Prepare identity
        env:
          CERT_B64: ${{ secrets.IDENTITY_CERT_BASE64 }}
          KEY_B64: ${{ secrets.IDENTITY_KEY_BASE64 }}
        run: |
          mkdir -p WePlay/Resources
          if [ -n "$CERT_B64" ] && [ -n "$KEY_B64" ]; then
            echo "$CERT_B64" | base64 --decode > WePlay/Resources/leaf.cer
            echo "$KEY_B64" | base64 --decode > WePlay/Resources/private.x963
            echo "identity injected: $(wc -c < WePlay/Resources/leaf.cer) B cert, $(wc -c < WePlay/Resources/private.x963) B key"
          else
            # 占位：保证 xcodegen 的资源列表一致；无身份时 App 能跑但过不了认证
            printf 'placeholder' > WePlay/Resources/leaf.cer
            printf 'placeholder' > WePlay/Resources/private.x963
            echo "no secrets: using placeholders"
          fi

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      # 构建号 = run number，让真机上能区分装的是哪一次构建
      - name: Stamp version
        run: |
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" WePlay/App/Info.plist
          plutil -replace CFBundleShortVersionString -string "0.0.1" WePlay/App/Info.plist
          plutil -p WePlay/App/Info.plist | grep -E "Version"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project WePlay.xcodeproj \
            -scheme WePlay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WePlay.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \


      - name: Package IPA
        run: |
          IPA="WePlay-0.0.1-b${{ github.run_number }}.ipa"
          mkdir -p build/Payload
          cp -R "build/WePlay.xcarchive/Products/Applications/WePlay.app" build/Payload/
          (cd build && zip -qry "$IPA" Payload)
          shasum -a 256 "build/$IPA"

      - name: Self-test
        run: |
          python3 -I Tools/link_selftest.py
          python3 -I Tools/rtp_selftest.py

      - uses: actions/upload-artifact@v4
        with:
          name: WePlay-0.0.1-b${{ github.run_number }}
          path: build/WePlay-0.0.1-b${{ github.run_number }}.ipa
          # 产物含 MFi 身份文件：1 天自动删除，缩小公开暴露窗口；测试期手动下载即可
          retention-days: 1
